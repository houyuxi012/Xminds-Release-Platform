openapi: 3.1.0
info:
  title: Xminds Release Platform API
  version: 0.1.0-p0
  description: |
    Xminds Release Platform 管理面与工作负载 API 基础契约。
    管理操作使用 OIDC Bearer Token，自动化工作负载使用独立工作负载令牌。
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /
    description: 当前部署来源
security:
  - oidcBearer: []
tags:
  - name: System
    description: 存活、就绪和版本信息
  - name: Products
    description: 多产品注册、产品范围查询与生命周期管理
  - name: Artifacts
    description: 可恢复分块上传、服务端摘要校验与不可变制品元数据
  - name: Releases
    description: Release 创建、职责分离审批、幂等发布、重试与撤销
  - name: Audit
    description: 产品范围内的不可变审计事件查询与导出
  - name: SCM
    description: GitHub、GHES 与 GitLab Self-Managed 连接、密文凭据和 Webhook
  - name: Endpoints
    description: 分发端点注册、目录摘要探测与健康状态管理
  - name: Identity Governance
    description: 组织单元、角色绑定及身份源草稿的受控管理
  - name: Local Authentication
    description: 本地账户一次性激活、本地登录与独立应急登录
  - name: Public Distribution
    description: 无需登录的 TUF 元数据兼容下载与产品范围制品下载
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: 存活检查
      description: 仅表示进程可响应，不检查外部依赖。
      tags: [System]
      security: []
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              examples:
                live:
                  value:
                    status: ok
        '500':
          $ref: '#/components/responses/InternalError'
  /health/ready:
    get:
      operationId: getReadiness
      summary: 就绪检查
      description: 检查 PostgreSQL 等关键依赖是否可用。
      tags: [System]
      security: []
      responses:
        '200':
          description: 服务就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              examples:
                ready:
                  value:
                    status: ready
        '503':
          description: 关键依赖不可用
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /version:
    get:
      operationId: getVersion
      summary: 获取构建版本
      tags: [System]
      security: []
      responses:
        '200':
          description: 当前构建信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildInfo'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/local/activate:
    post:
      operationId: activateLocalAccount
      summary: 消费一次性激活令牌并设置本地密码
      tags: [Local Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateLocalAccountRequest'
      responses:
        '204':
          description: 账户已激活，无响应体
        '400':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/local/login:
    post:
      operationId: loginLocalAccount
      summary: 使用普通本地账户登录
      tags: [Local Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalLoginRequest'
      responses:
        '200':
          description: 一次性返回不透明持久会话令牌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalLoginResponse'
        '400':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: 账号或来源 IP 超过固定窗口限制
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/emergency/login:
    post:
      operationId: loginEmergencyAccount
      summary: 使用独立应急入口和 MFA 登录
      tags: [Local Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalLoginRequest'
      responses:
        '200':
          description: 一次性返回短时应急会话令牌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalLoginResponse'
        '400':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: 账号或来源 IP 超过固定窗口限制
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products:
    post:
      operationId: registerProduct
      summary: 注册产品及默认通道
      description: 仅平台管理员可调用；产品、默认通道和审计事件在同一数据库事务中提交。
      tags: [Products]
      x-required-action: product.register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductManifestV1'
      responses:
        '201':
          description: 产品已注册
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 产品 ID 或 Manifest 摘要已存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '413':
          description: Manifest 超过大小限制
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: 请求媒体类型不受支持
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Manifest 不符合 v1 契约
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    get:
      operationId: listProducts
      summary: 查询当前身份有权访问的产品
      tags: [Products]
      x-required-action: product.read
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: 服务端返回的不透明分页游标。
          schema:
            type: string
            maxLength: 512
      responses:
        '200':
          description: 产品页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          description: 分页参数无效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/products/{product_id}:
    get:
      operationId: getProduct
      summary: 获取产品详情与默认通道
      tags: [Products]
      x-required-action: product.read
      parameters:
        - $ref: '#/components/parameters/ProductIDPath'
      responses:
        '200':
          description: 产品详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 产品不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/products/{product_id}/deactivate:
    post:
      operationId: deactivateProduct
      summary: 停用产品
      description: 停用不删除产品、Manifest、通道或历史审计证据。
      tags: [Products]
      x-required-action: product.manage
      parameters:
        - $ref: '#/components/parameters/ProductIDPath'
      responses:
        '200':
          description: 产品已停用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 产品不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/products/{product_id}/artifact-uploads:
    post:
      operationId: beginArtifactUpload
      summary: 创建可恢复制品上传会话
      description: 创建有效期 24 小时的临时上传会话；最终对象仅在服务端 SHA-256 校验通过后可见。
      tags: [Artifacts]
      security:
        - oidcBearer: []
        - workloadBearer: []
      x-required-action: artifact.publish
      parameters:
        - $ref: '#/components/parameters/ProductIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeginArtifactUploadRequest'
      responses:
        '201':
          description: 上传会话已创建
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactUpload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 产品不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '413':
          description: 请求或制品声明超过大小限制
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: 请求媒体类型不受支持
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: 制品元数据无效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/products/{product_id}/artifact-uploads/{upload_id}/parts/{part_number}:
    put:
      operationId: putArtifactUploadPart
      summary: 上传或重传制品分块
      description: 相同 part_number 可安全重传并替换旧分块；除最终分块外每块至少 5 MiB，单块不超过 256 MiB。
      tags: [Artifacts]
      security:
        - oidcBearer: []
        - workloadBearer: []
      x-required-action: artifact.publish
      parameters:
        - $ref: '#/components/parameters/ProductIDPath'
        - $ref: '#/components/parameters/UploadIDPath'
        - name: part_number
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 10000
        - name: X-Part-SHA256
          in: header
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: 分块已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactUploadPart'
        '400':
          description: 上传 ID 或分块编号无效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 上传会话不存在或不属于路径产品
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '410':
          description: 上传会话已过期
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '411':
          description: 缺少 Content-Length
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '413':
          description: 分块超过 256 MiB
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: 请求媒体类型不受支持
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: 分块大小或摘要无效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/products/{product_id}/artifact-uploads/{upload_id}/complete:
    post:
      operationId: completeArtifactUpload
      summary: 完成上传并校验制品
      description: 服务端流式计算完整对象 SHA-256；不信任客户端 ETag，摘要不一致时隔离临时对象并创建清理任务。
      tags: [Artifacts]
      security:
        - oidcBearer: []
        - workloadBearer: []
      x-required-action: artifact.publish
      parameters:
        - $ref: '#/components/parameters/ProductIDPath'
        - $ref: '#/components/parameters/UploadIDPath'
      responses:
        '200':
          description: 制品已校验并固化，或返回已有内容寻址制品
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        '400':
          description: 上传 ID 无效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 上传会话不存在或不属于路径产品
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: 分块不完整或上传状态冲突
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '410':
          description: 上传会话已过期
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: 完整对象摘要或大小不匹配
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/products/{product_id}/artifacts/{artifact_id}:
    get:
      operationId: getArtifact
      summary: 获取产品范围内的不可变制品元数据
      tags: [Artifacts]
      security:
        - oidcBearer: []
        - workloadBearer: []
      x-required-action: product.read
      parameters:
        - $ref: '#/components/parameters/ProductIDPath'
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 制品元数据；不暴露内部对象存储键或凭据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        '400':
          description: 制品 ID 无效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 制品不存在或未绑定到路径产品
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/products/{product_id}/releases:
    post:
      operationId: createRelease
      summary: 创建不可变 Release 草稿
      tags: [Releases]
      security:
        - oidcBearer: []
        - workloadBearer: []
      x-required-action: release.create
      parameters:
        - $ref: '#/components/parameters/ProductIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReleaseRequest'
      responses:
        '201':
          description: Release 草稿已创建
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Release 请求超过大小限制
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: 请求媒体类型不受支持
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/products/{product_id}/releases/{release_id}:
    get:
      operationId: getRelease
      summary: 获取产品范围内的 Release
      tags: [Releases]
      security:
        - oidcBearer: []
        - workloadBearer: []
      x-required-action: product.read
      parameters:
        - $ref: '#/components/parameters/ProductIDPath'
        - $ref: '#/components/parameters/ReleaseIDPath'
      responses:
        '200':
          description: Release 详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/products/{product_id}/releases/{release_id}/submit:
    post:
      operationId: submitRelease
      summary: 提交 Release 审批
      tags: [Releases]
      security:
        - oidcBearer: []
        - workloadBearer: []
      x-required-action: release.submit
      parameters:
        - $ref: '#/components/parameters/ProductIDPath'
        - $ref: '#/components/parameters/ReleaseIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseTransitionRequest'
      responses:
        '200':
          description: Release 已提交
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/products/{product_id}/releases/{release_id}/approve:
    post:
      operationId: approveRelease
      summary: 独立审批人批准 Release
      description: 提交者不得批准本人提交的 Release。
      tags: [Releases]
      security:
        - oidcBearer: []
        - workloadBearer: []
      x-required-action: release.approve
      parameters:
        - $ref: '#/components/parameters/ProductIDPath'
        - $ref: '#/components/parameters/ReleaseIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseTransitionRequest'
      responses:
        '200':
          description: Release 已批准
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/products/{product_id}/releases/{release_id}/reject:
    post:
      operationId: rejectRelease
      summary: 独立审批人拒绝 Release
      tags: [Releases]
      security:
        - oidcBearer: []
        - workloadBearer: []
      x-required-action: release.approve
      parameters:
        - $ref: '#/components/parameters/ProductIDPath'
        - $ref: '#/components/parameters/ReleaseIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseReasonRequest'
      responses:
        '200':
          description: Release 已拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/products/{product_id}/releases/{release_id}/publish:
    post:
      operationId: publishRelease
      summary: 原子启动 Release 发布
      description: 状态迁移、attempt、审计与 catalog.publish.v1 作业在同一事务提交。
      tags: [Releases]
      security:
        - oidcBearer: []
        - workloadBearer: []
      x-required-action: release.publish
      parameters:
        - $ref: '#/components/parameters/ProductIDPath'
        - $ref: '#/components/parameters/ReleaseIDPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseTransitionRequest'
      responses:
        '200':
          description: 发布 attempt 已创建，或返回原幂等结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseOperationResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/products/{product_id}/releases/{release_id}/retry:
    post:
      operationId: retryReleasePublication
      summary: 审批人授权重试失败发布
      tags: [Releases]
      security:
        - oidcBearer: []
        - workloadBearer: []
      x-required-action: release.approve
      parameters:
        - $ref: '#/components/parameters/ProductIDPath'
        - $ref: '#/components/parameters/ReleaseIDPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseTransitionRequest'
      responses:
        '200':
          description: 重试 attempt 已创建，或返回原幂等结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseOperationResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/products/{product_id}/releases/{release_id}/revoke:
    post:
      operationId: revokeRelease
      summary: 撤销已发布 Release
      description: Release 保持 PUBLISHED，并记录不可变撤销证据与 catalog.revoke.v1 作业。
      tags: [Releases]
      security:
        - oidcBearer: []
        - workloadBearer: []
      x-required-action: release.approve
      parameters:
        - $ref: '#/components/parameters/ProductIDPath'
        - $ref: '#/components/parameters/ReleaseIDPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseReasonRequest'
      responses:
        '200':
          description: 撤销 attempt 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseOperationResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/endpoints:
    post:
      operationId: registerDistributionEndpoint
      summary: 注册分发端点
      description: 端点先以 pending 状态登记，必须通过 HTTPS 目录摘要探测后才能激活。
      tags: [Endpoints]
      x-required-action: integration.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistributionEndpointRequest'
      responses:
        '201':
          description: 分发端点已登记
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributionEndpoint'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          description: 请求媒体类型不受支持
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/endpoints/{endpoint_id}:
    get:
      operationId: getDistributionEndpoint
      summary: 查询分发端点状态
      tags: [Endpoints]
      x-required-action: integration.manage
      parameters:
        - $ref: '#/components/parameters/EndpointIDPath'
      responses:
        '200':
          description: 分发端点详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributionEndpoint'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/endpoints/{endpoint_id}/activate:
    post:
      operationId: activateDistributionEndpoint
      summary: 校验并激活分发端点
      description: 通过 HTTPS 健康探针读取根与时间戳摘要，并与当前产品目录精确比对。
      tags: [Endpoints]
      x-required-action: integration.manage
      parameters:
        - $ref: '#/components/parameters/EndpointIDPath'
      responses:
        '200':
          description: 端点已通过摘要校验并激活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributionEndpoint'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 探针失败或目录摘要不一致
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /metadata/{role}.json:
    get:
      operationId: getCompatibilityCatalogRole
      summary: 获取默认产品与通道的 TUF 元数据
      description: 面向既有客户端的兼容路径；默认产品与通道由服务端部署配置唯一确定。
      tags: [Public Distribution]
      security: []
      parameters:
        - $ref: '#/components/parameters/CatalogRolePath'
      responses:
        '200':
          $ref: '#/components/responses/CatalogMetadata'
        '304':
          description: ETag 未变化
        '404':
          description: 角色或当前目录不存在
        '503':
          description: 目录对象暂时不可用
  /v1/products/{product}/channels/{channel}/metadata/{role}.json:
    get:
      operationId: getProductCatalogRole
      summary: 获取指定产品通道的 TUF 元数据
      tags: [Public Distribution]
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicProductPath'
        - $ref: '#/components/parameters/PublicChannelPath'
        - $ref: '#/components/parameters/CatalogRolePath'
      responses:
        '200':
          $ref: '#/components/responses/CatalogMetadata'
        '304':
          description: ETag 未变化
        '404':
          description: 产品、通道、角色或当前目录不存在
        '503':
          description: 目录对象暂时不可用
  /v1/products/{product}/artifacts/{sha256}:
    get:
      operationId: downloadProductArtifact
      summary: 按 SHA-256 下载产品制品
      description: 摘要必须归属于路径中的产品；支持单个 HTTP 字节范围，不接受多段范围请求。
      tags: [Public Distribution]
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicProductPath'
        - name: sha256
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
        - name: Range
          in: header
          required: false
          schema:
            type: string
            pattern: '^bytes=[0-9]*-[0-9]*$'
      responses:
        '200':
          description: 完整制品
          headers:
            Accept-Ranges:
              schema:
                type: string
                const: bytes
            Content-Disposition:
              schema:
                type: string
                const: attachment
            ETag:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: 单段范围内容
          headers:
            Content-Range:
              schema:
                type: string
            Accept-Ranges:
              schema:
                type: string
                const: bytes
            Content-Disposition:
              schema:
                type: string
                const: attachment
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '304':
          description: ETag 未变化
        '404':
          description: 产品范围内不存在该摘要
        '416':
          description: Range 无效或请求了多段范围
        '503':
          description: 制品对象暂时不可用
  /api/v1/audit-events:
    get:
      operationId: queryAuditEvents
      summary: 查询不可变审计事件
      description: 仅允许具有目标产品 audit.read 权限的审计员或管理员访问。
      tags: [Audit]
      x-required-action: audit.read
      parameters:
        - $ref: '#/components/parameters/ProductID'
        - name: actor_subject
          in: query
          schema:
            type: string
            maxLength: 512
        - name: action
          in: query
          schema:
            type: string
            maxLength: 128
        - name: outcome
          in: query
          schema:
            $ref: '#/components/schemas/AuditOutcome'
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          schema:
            type: string
            format: date-time
        - name: before_time
          in: query
          description: 与 before_id 同时提供的稳定时间游标。
          schema:
            type: string
            format: date-time
        - name: before_id
          in: query
          description: 与 before_time 同时提供的 UUID 游标。
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: 审计事件页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/audit-exports:
    post:
      operationId: startAuditExport
      summary: 发起审计导出
      description: 持久化不可变导出请求，并在同一事务中创建 audit.export.v1 作业。
      tags: [Audit]
      x-required-action: audit.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditExportRequest'
      responses:
        '202':
          description: 导出请求已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditExport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/audit-exports/{export_id}:
    get:
      operationId: getAuditExport
      summary: 获取审计导出状态
      tags: [Audit]
      x-required-action: audit.read
      parameters:
        - name: export_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 审计导出状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditExport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 导出请求不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/scm/connections:
    post:
      operationId: createSCMConnection
      summary: 创建并验证 SCM 连接
      description: 仅接受 HTTPS API Base URL；域名解析结果、企业 CA 与代理策略在连接上显式固化。
      tags: [SCM]
      x-required-action: product.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SCMConnectionRequest'
      responses:
        '201':
          description: 连接已创建并完成 TLS 与能力探测
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCMConnection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/scm/connections/{connection_id}/verify:
    post:
      operationId: verifySCMConnection
      summary: 重新验证 SCM 连接与证书指纹
      tags: [SCM]
      x-required-action: product.manage
      parameters:
        - $ref: '#/components/parameters/SCMConnectionIDPath'
      responses:
        '200':
          description: 当前能力与 TLS 证据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCMCapabilities'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/scm/connections/{connection_id}/credentials:
    post:
      operationId: rotateSCMCredential
      summary: 写入新版本凭据并立即撤销同类型旧版本
      description: 响应永不包含明文、密文、Nonce 或主密钥标识。
      tags: [SCM]
      x-required-action: product.manage
      parameters:
        - $ref: '#/components/parameters/SCMConnectionIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SCMCredentialRequest'
      responses:
        '201':
          description: 凭据已轮换
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCMCredentialMetadata'
  /api/v1/scm/webhooks/{connection_id}:
    post:
      operationId: receiveSCMWebhook
      summary: 接收签名 SCM Webhook
      description: 无 Bearer 认证；使用连接专属 Webhook 密钥验证并按事件 ID 幂等处理，最大请求体 10 MiB。
      tags: [SCM]
      security: []
      parameters:
        - $ref: '#/components/parameters/SCMConnectionIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '202':
          description: 首次或重复投递均返回稳定投递标识
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCMWebhookReceipt'
        '401':
          description: Webhook 签名无效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/organizations:
    get:
      operationId: listOrganizations
      summary: 查询组织单元
      tags: [Identity Governance]
      x-required-action: identity.manage
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 组织单元页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
    post:
      operationId: createOrganization
      summary: 创建平台本地组织单元
      description: 仅创建平台本地组织，不可伪造外部目录主数据。
      tags: [Identity Governance]
      x-required-action: identity.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: 组织单元已创建并审计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
  /api/v1/role-bindings:
    get:
      operationId: listRoleBindings
      summary: 查询角色绑定
      description: 此 P0 增量仅公开只读查询；创建和删除仍限服务层受控调用。
      tags: [Identity Governance]
      x-required-action: identity.manage
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 角色绑定页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleBindingPage'
  /api/v1/identity-sources:
    get:
      operationId: listIdentitySources
      summary: 查询身份源
      tags: [Identity Governance]
      x-required-action: identity.manage
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 身份源页；不包含 Secret 引用。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentitySourcePage'
    post:
      operationId: createIdentitySourceDraft
      summary: 创建身份源草稿
      description: Secret 引用仅可写入；任何响应均不返回该引用。
      tags: [Identity Governance]
      x-required-action: identity.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIdentitySourceRequest'
      responses:
        '201':
          description: 身份源草稿已创建并审计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentitySource'
  /api/v1/identity-sources/{source_id}:
    patch:
      operationId: patchIdentitySourceDraft
      summary: 更新身份源草稿
      description: 仅草稿可更新；`version` 是必填乐观锁。该增量不提供启用、停用、同步或任何客户端自报重新认证时间戳接口。
      tags: [Identity Governance]
      x-required-action: identity.manage
      parameters:
        - $ref: '#/components/parameters/IdentitySourceIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchIdentitySourceRequest'
      responses:
        '200':
          description: 草稿已更新并审计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentitySource'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  parameters:
    ProductIDPath:
      name: product_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]{1,62}$'
    ProductID:
      name: product_id
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    UploadIDPath:
      name: upload_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReleaseIDPath:
      name: release_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'
    SCMConnectionIDPath:
      name: connection_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EndpointIDPath:
      name: endpoint_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PublicProductPath:
      name: product
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]{1,62}$'
    PublicChannelPath:
      name: channel
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9._-]{0,63}$'
    CatalogRolePath:
      name: role
      in: path
      required: true
      schema:
        type: string
        enum: [root, targets, snapshot, timestamp, revocation]
    IdentitySourceIDPath:
      name: source_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: 服务端返回的不透明分页游标。
      schema:
        type: string
        maxLength: 512
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: OIDC-JWT
      description: 面向控制台用户的企业 OIDC 身份令牌；Issuer 通过部署配置提供。
    workloadBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 面向 CI/CD、客户端与同步执行器的短期工作负载令牌。
  responses:
    CatalogMetadata:
      description: 已签名的 TUF 元数据封装
      headers:
        Cache-Control:
          schema:
            type: string
        ETag:
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    InternalError:
      description: 服务内部错误
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Bearer Token 缺失、无效或已过期
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: 身份已验证但缺少产品范围或 audit.read 权限
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: 产品范围内的资源不存在
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: 状态、乐观锁、唯一性或幂等约束冲突
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnprocessableEntity:
      description: 请求字段或业务规则校验失败
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    DistributionEndpointRequest:
      type: object
      additionalProperties: false
      required: [product_id, name, type, region, priority, base_url, path_prefix, health_path]
      properties:
        product_id:
          type: string
          pattern: '^[a-z][a-z0-9-]{1,62}$'
        name:
          type: string
          minLength: 1
          maxLength: 128
        type:
          type: string
          enum: [origin, cdn, private]
        region:
          type: string
          pattern: '^[a-z][a-z0-9-]{1,62}$'
        priority:
          type: integer
          minimum: 0
          maximum: 1000
        base_url:
          type: string
          format: uri
          pattern: '^https://'
        path_prefix:
          type: string
          pattern: '^/'
          maxLength: 512
        health_path:
          type: string
          pattern: '^/'
          maxLength: 512
        tls_ca_ref:
          type: string
          maxLength: 256
    DistributionEndpoint:
      allOf:
        - $ref: '#/components/schemas/DistributionEndpointRequest'
        - type: object
          required: [id, status, failure_count, created_at, updated_at]
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: [pending, active, unhealthy, disabled]
            last_root_digest:
              type: string
              pattern: '^[0-9a-f]{64}$'
            last_timestamp_digest:
              type: string
              pattern: '^[0-9a-f]{64}$'
            last_checked_at:
              type: string
              format: date-time
            failure_count:
              type: integer
              minimum: 0
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    SCMConnectionRequest:
      type: object
      additionalProperties: false
      required: [product_id, name, provider, api_base_url, resolved_addresses]
      properties:
        product_id:
          type: string
          pattern: '^[a-z][a-z0-9-]{1,62}$'
        name:
          type: string
          minLength: 1
          maxLength: 128
        provider:
          type: string
          enum: [github, gitlab]
        api_base_url:
          type: string
          format: uri
          pattern: '^https://'
        api_version:
